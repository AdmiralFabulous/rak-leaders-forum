<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAK Rising — Print</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="book.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<style>
  :root{ --print-scale: 0.66; }
  html,body{ margin:0; background:#081c28; }
  /* On screen: stack the pages on the dark stage for review */
  .print-page{
    width:1003px; height:660px;            /* 1520×1000 · scale 0.66 */
    position:relative; overflow:hidden;
    margin:24px auto;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .print-page > .book{
    position:absolute; top:0; left:0;
    transform:scale(var(--print-scale)); transform-origin:top left;
    box-shadow:none;
  }

  @media print{
    html,body{ background:#fff; }
    @page{ size:landscape; margin:0.5cm; }
    *, *::before, *::after{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    /* jump entrance animations to their end state */
    *, *::before, *::after{
      animation-delay:-99s !important; animation-duration:.001s !important;
      animation-iteration-count:1 !important; animation-fill-mode:both !important;
      animation-play-state:running !important; transition-duration:0s !important;
    }
    .print-page{
      width:1003px; height:660px; margin:0 auto;
      box-shadow:none; break-after:page; page-break-after:always;
      display:flex; align-items:center; justify-content:center;
    }
    .print-page:last-child{ break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="spreads.jsx"></script>
<script type="text/babel">
function PrintBook() {
  return (
    <React.Fragment>
      {window.SPREADS.map((sp) => (
        <div className="print-page" key={sp.id}>
          <div className={"book" + (sp.bleed ? " is-bleed" : "")} data-active>
            {sp.render()}
          </div>
        </div>
      ))}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<PrintBook />);

// auto-open the print dialog once fonts, images and layout are ready
(async function autoPrint(){
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const imgs = [...document.images];
  await Promise.all(imgs.map(img => img.complete ? null : new Promise(res => { img.onload = img.onerror = res; })));
  setTimeout(() => window.print(), 600);
})();
</script>
</body>
</html>
