<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAK Rising — Print (phone & desktop)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="book.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<style>
  /* Two sheet types so every page FILLS:
     · single book-pages (760×1000, portrait) print on A4 portrait
     · full-bleed spreads (1520×1000, landscape) print on A4 landscape
     Each leaf is scaled to fill its sheet's width. */
  html,body{ margin:0; background:#5f6d73; }
  #staging{ position:absolute; left:-99999px; top:0; }

  .pdf-page{
    margin:20px auto; background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 16px 46px rgba(0,0,0,.42);
  }
  .pdf-page.single{ width:794px;  height:1123px; }   /* A4 portrait  */
  .pdf-page.bleed { width:1123px; height:794px;  }   /* A4 landscape */

  .pdf-holder{ position:relative; transform-origin:center; flex:none; }
  /* 760 → 794 wide : fill the portrait sheet */
  .pdf-holder.single{ width:760px;  height:1000px; background:var(--pearl); transform:scale(1.0447); }
  /* 1520 → 1123 wide : fill the landscape sheet */
  .pdf-holder.bleed { width:1520px; height:1000px; background:var(--pearl); transform:scale(0.7388); }

  @media print{
    html,body{ background:#fff; }
    @page portrait { size:A4 portrait;  margin:0; }
    @page land     { size:A4 landscape; margin:0; }
    *, *::before, *::after{
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
      animation-delay:-99s !important; animation-duration:.001s !important;
      animation-iteration-count:1 !important; animation-fill-mode:both !important;
      animation-play-state:running !important; transition-duration:0s !important;
    }
    .pdf-page{ margin:0; box-shadow:none; break-after:page; page-break-after:always; }
    .pdf-page.single{ page:portrait; width:794px;  height:1123px; }
    .pdf-page.bleed { page:land;     width:1123px; height:794px;  }
    .pdf-page:last-child{ break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>
<div id="staging"></div>
<div id="out"></div>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="spreads.jsx"></script>
<script type="text/babel">
function Staging() {
  return (
    <React.Fragment>
      {window.SPREADS.map((sp) => (
        <div className={"book" + (sp.bleed ? " is-bleed" : "")} data-active key={sp.id}>
          {sp.render()}
        </div>
      ))}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("staging")).render(<Staging />);

function mkLeaf(kind) {
  const page = document.createElement("div");
  page.className = "pdf-page " + kind;
  const holder = document.createElement("div");
  holder.className = "pdf-holder " + kind;
  page.appendChild(holder);
  return page;
}

(async function build() {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const race = (p, ms) => Promise.race([p, wait(ms)]);

  // small delay for React to mount (rAF is unreliable in hidden iframes)
  await wait(60);
  try { if (document.fonts && document.fonts.ready) await race(document.fonts.ready, 3000); } catch (e) {}
  try {
    const imgs = [...document.images];
    await race(Promise.all(imgs.map((im) => im.complete ? null : new Promise((res) => { im.onload = im.onerror = res; }))), 4000);
  } catch (e) {}

  try {
    const out = document.getElementById("out");
    document.querySelectorAll("#staging > .book").forEach((book) => {
      if (book.classList.contains("is-bleed")) {
        const leaf = mkLeaf("bleed");
        const clone = book.cloneNode(true);
        clone.style.cssText = "position:relative;box-shadow:none;width:1520px;height:1000px;";
        leaf.firstChild.appendChild(clone);
        out.appendChild(leaf);
      } else {
        book.querySelectorAll(":scope > .page").forEach((pg) => {
          const leaf = mkLeaf("single");
          const clone = pg.cloneNode(true);
          clone.style.cssText = "position:relative;width:760px;height:1000px;";
          leaf.firstChild.appendChild(clone);
          out.appendChild(leaf);
        });
      }
    });
    const stage = document.getElementById("staging");
    if (stage) stage.remove();
  } catch (e) { console.error("build failed", e); }

  await wait(500);
  if (!/[?&]noprint/.test(location.search)) window.print();
})();
</script>
</body>
</html>
