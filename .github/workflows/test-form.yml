name: Test enquiry form delivery

# Manual smoke test: POSTs one clearly-labelled TEST enquiry to the Google
# Apps Script endpoint so the Sheet row + email to ao@swissdragons.com can be
# verified end-to-end. Run from the Actions tab whenever needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST a test enquiry
        run: |
          set -e
          RESP=$(curl -s -L --max-time 45 \
            -X POST "https://script.google.com/macros/s/AKfycbyCkmtFsjuO-u4rjVXi8ICr-mLc-gy-ZijUQlSCe3JxvNB0yxB2lJYJYxtJ3864Ld6F/exec" \
            --data-urlencode "name=CI Smoke Test" \
            --data-urlencode "email=ci-test@example.com" \
            --data-urlencode "subject=TEST — automated delivery check (safe to ignore)" \
            --data-urlencode "message=This is an automated test from GitHub Actions confirming the form endpoint appends to the Sheet and emails ao@swissdragons.com. No action needed.")
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"ok":true' && echo "DELIVERY OK" || { echo "DELIVERY FAILED"; exit 1; }
