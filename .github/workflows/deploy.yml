name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_form:
        description: "Also POST a labelled TEST enquiry to verify Sheet + email delivery"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (prod)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e
          SITE_NAME="kaikata-rakleadersforum"
          FALLBACK_ID="81ee9b8a-aa60-4cbc-bc6b-62e946c85e83"

          # Resolve the site by the name in the live URL (so deploys can't drift
          # to the wrong target); fall back to the known id if the lookup fails.
          SITE_ID=$(netlify api listSites --data '{}' \
            | jq -r --arg n "$SITE_NAME" '.[] | select(.name==$n) | .id' | head -n1)
          if [ -z "$SITE_ID" ] || [ "$SITE_ID" = "null" ]; then
            SITE_ID="$FALLBACK_ID"
          fi
          echo "Deploying to site id: $SITE_ID ($SITE_NAME)"

          netlify deploy --dir . --prod --site "$SITE_ID" \
            --message "Deploy from GitHub commit ${{ github.sha }}"

      - name: Smoke-test form delivery (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_form }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RESP=$(curl -s -L --max-time 45 -w "\nHTTP_FINAL:%{http_code} URL:%{url_effective}" \
            -X POST "https://script.google.com/macros/s/AKfycbyCkmtFsjuO-u4rjVXi8ICr-mLc-gy-ZijUQlSCe3JxvNB0yxB2lJYJYxtJ3864Ld6F/exec" \
            --data-urlencode "name=CI Smoke Test" \
            --data-urlencode "email=ci-test@example.com" \
            --data-urlencode "subject=TEST — automated delivery check (safe to ignore)" \
            --data-urlencode "message=Automated test confirming the form endpoint appends to the Sheet and emails ao@swissdragons.com. No action needed.")
          echo "Response: $RESP"
          # Report the raw response so it can be inspected even when CI logs are unavailable.
          jq -n --arg b "$(printf '%s' "$RESP" | head -c 5000)" '{title:"FORM TEST RESPONSE", body:("```\n"+$b+"\n```")}' \
            | curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues" -d @- >/dev/null
          echo "$RESP" | grep -q '"ok":true' && echo "FORM DELIVERY OK" || { echo "FORM DELIVERY FAILED"; exit 1; }
